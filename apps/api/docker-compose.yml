services:
  postgres:
    image: postgres:16-alpine
    container_name: quakestudio-postgres
    environment:
      POSTGRES_DB: quakestudio
      POSTGRES_USER: quakestudio
      POSTGRES_PASSWORD: quakestudio
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - quakestudio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quakestudio -d quakestudio']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quakestudio-postgres:
