<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="QuakeStudio — an educational earthquake response simulator. Not a structural safety assessment."
    />
    <title>QuakeStudio</title>

    <!--
      Progressive Web App. See docs/pwa.md for why each of these is here.

      The two light/dark <meta name="theme-color"> tags are the part that is
      easy to miss: the browser picks the first one whose media query matches,
      so a single tag gives a white status bar in dark mode. The app follows
      prefers-color-scheme for the UI, and the install prompt should match it.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#15803d" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      iOS ignores the manifest for most of this. Without these three, "Add to
      Home Screen" opens the page in a browser tab with a URL bar, and the
      status bar overlaps the top of the app.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuakeStudio" />

    <!-- viewport-fit=cover lets the layout extend under a notched display. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Applies the stored theme BEFORE first paint so the page never flashes
      // the wrong colour scheme. Mirrors the logic in src/lib/theme.ts —
      // keep the two in sync.
      (function () {
        try {
          var stored = localStorage.getItem('quakestudio.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage may be unavailable (private mode); fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
