<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QuakeStudio — an educational earthquake response simulator. Not a structural safety assessment."
    />
    <title>QuakeStudio</title>
    <script>
      // Applies the stored theme BEFORE first paint so the page never flashes
      // the wrong colour scheme. Mirrors the logic in src/lib/theme.ts —
      // keep the two in sync.
      (function () {
        try {
          var stored = localStorage.getItem('quakestudio.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage may be unavailable (private mode); fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
